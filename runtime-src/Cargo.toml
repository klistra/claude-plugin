[package]
name = "klistra-runtime"
version = "0.3.1"
description = "klistra's runtime for Claude Code: the plugin's MCP server over stdio, which carries this computer's klistra token and brings the person's messages from the studio's chat into the session, and the login that connects the computer"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "klistra"
path = "src/main.rs"

[dependencies]
# SHA-256 and the system's random numbers; rustls (under ureq) builds on it already.
ring = "0.17"
serde_json = "1"
# HTTPS with Mozilla's root certificates built in, so no system store is needed.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
